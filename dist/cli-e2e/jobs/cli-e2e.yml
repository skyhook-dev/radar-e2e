# Job fragment for the CLI functional e2e - see CONTRACT.md at the repo root
# for the shared `resolve-version` job this depends on, and the rules every
# fragment must follow (version guard, failure messaging, free OS runners).
#
# What this proves: a real user's install path (the public quick-install
# script, the same one https://get.radarhq.io serves) produces a
# `kubectl-radar` that (a) actually reports the version everyone believes was
# just published, and (b) drives a real kind cluster correctly end to end -
# resources, workload detail, topology, timeline, pod logs, and network
# reachability - through the SAME web UI the binary serves to a laptop.
#
# Deliberately NOT a main-vs-published matrix like the hub suite's: there is
# only one artifact here (the published binary), so there is nothing to
# build and nothing to compare it against. The version-equality assertion
# below is what stands in for that: it is the one check whose entire purpose
# is catching a distribution channel that has gone stale (the motivating case
# in CONTRACT.md - the Homebrew formula sitting on 1.3.2 while 1.9.2 shipped,
# and nothing noticed).
#
# Linux only. kind needs Docker, which GitHub-hosted macOS and Windows
# runners don't provide - the CONTRACT's "all three OSes are free" note is
# about runner *cost*, not about every fragment needing all three; a
# real kind+Docker browser e2e is a Linux-runner job here.
#
# One job per scenario, each with its own kind cluster and its own radar
# process on its own runner - a scenario that wedges its cluster can't take
# the others down with it, and they finish in the time of the slowest rather
# than the sum.
jobs:
  cli-e2e:
    needs: resolve-version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: smoke
            specs: smoke
          - scenario: resources
            specs: resources
          - scenario: topology
            specs: topology
          - scenario: timeline
            specs: timeline
          - scenario: logs
            specs: logs
          - scenario: diagnose
            specs: diagnose
    steps:
      - name: Checkout this harness
        uses: actions/checkout@v6

      # The same command a Linux user runs from the README - not a pinned
      # release-asset download. Pinning to the resolved tag would test that
      # ONE artifact builds correctly, which the release pipeline already
      # guarantees; it would never catch a stale distribution channel, which
      # is the actual point of this job (see CONTRACT.md).
      - name: Install kubectl-radar via the public quick-install script
        run: curl -fsSL https://get.radarhq.io | sh

      - name: Put the install location on PATH
        run: |
          for dir in /usr/local/bin "$HOME/.local/bin"; do
            if [ -x "$dir/kubectl-radar" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              break
            fi
          done

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli-e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-cli-e2e-${{ runner.os }}-${{ hashFiles('cli-e2e/package-lock.json') }}

      - name: Run CLI e2e
        env:
          RADAR_EXPECTED_VERSION: ${{ needs.resolve-version.outputs.version }}
          CLUSTER: dist-e2e-${{ matrix.scenario }}
          SCENARIO: ${{ matrix.scenario }}
          SPECS: ${{ matrix.specs }}
        working-directory: cli-e2e
        run: ./run.sh all

      - name: Collect diagnostics
        if: always()
        working-directory: cli-e2e
        env:
          CLUSTER: dist-e2e-${{ matrix.scenario }}
        run: ./run.sh logs > diagnostics.txt 2>&1 || true

      # Uploaded on success too: the report carries the screenshots, which
      # are the only artifact that shows the UI as a user would actually see
      # it on this release.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-e2e-${{ matrix.scenario }}
          path: |
            cli-e2e/playwright-report/
            cli-e2e/test-results/
            cli-e2e/visual/
            cli-e2e/diagnostics.txt
          retention-days: 7

      # Tolerant on purpose: when the job fails before kind is installed
      # there is nothing to delete, and a teardown error would mask the real
      # failure.
      - name: Tear down
        if: always()
        working-directory: cli-e2e
        env:
          CLUSTER: dist-e2e-${{ matrix.scenario }}
        run: ./run.sh down || true
